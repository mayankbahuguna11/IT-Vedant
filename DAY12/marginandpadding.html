<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            background-color: aqua;
            border: 2px solid;
            /* Padding creates space inside the border, between the content and the border  */
            padding: 20px;
            /* Margin creates space outside an element's border to separate it from meighbors */
            margin: 20px;
        }

.box2{
    background-color: purple;
    border: 2px solid;
    padding-top: 20px;
    padding-left: 40px;
    padding-bottom: 5px;
    margin-left: 50px;
}

    </style>
</head>
<body>
        
         <div class="box1">
            box1
         </div>

         <div class="box2">
            box2
         </div>
</body>
</html>
