<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gridclass{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .img{
            border: 2px solid;
            width: 350px;
            height: 225px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="gridclass">
    <img src="taskimages/image.png" alt="Sports Bike" class="img">
    <img src="taskimages/image2.png" alt="Sports Bike" class="img">
    <img src="taskimages/image3.png" alt="Sports Bike" class="img">
    <img src="taskimages/image4.png" alt="Sports Bike" class="img">
    <img src="taskimages/image5.png" alt="Sports Bike" class="img">
    <img src="taskimages/image6.png" alt="Sports Bike" class="img">
    </div>
</body>
</html>
