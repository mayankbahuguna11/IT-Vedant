<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            margin-top: 90px;
            margin-left: 100px;
            width: 200px;

            transition: 0.5s;
        }

/* translate: To move the element vertically or horizontlly (along x-axis or y-axis) */
        /* img:hover{
            transform: translate(40px, 40px);
        } */

/* rotate: To rotate the element clockwise(+ve) or anti-clockwise(-ve) */
        /* img:hover{
            transform: rotate(-60deg);
        } */

/* scale: Increase or decrease size of the element */
        /* img:hover{
            transform: scale(1.2, 1.2);
        } */

/* skew:  Tilt an element. skewX for x-axis (default: skew) and skewY for y-axis */
        img:hover{
            transform: skew(-20deg);
        }

    </style>
</head>
<body>
    <img src="image.png" alt="">
</body>
