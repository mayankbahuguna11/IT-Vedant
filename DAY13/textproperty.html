<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-family: 'Courier New', Courier, monospace;
            /* Changes font style */
            font-size: 18px;
            /* Changes text size */
            font-weight: bold;
            /* Changes text thickness */
            font-style: italic;
            /* Changes text style */
            line-height: 1.6;
            /* Controls spacing between lines */
            letter-spacing: 2px;
            /* Controls spacing between letters */
            word-spacing: 5px;
            /* Controls spacing between words */
            text-align: center;
            /* Aligns text horizontally */
            text-decoration: underline;
            /* Adds or removes text decoration */
            text-transform: uppercase;
            /* Changes text capitalization */
            white-space: nowrap;
            /* Controls whitespace handling */
        }
    </style>
</head>
<body>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quis ratione corporis incidunt quas corrupti alias animi, cumque itaque quaerat porro!</p>
</body>
</html>
