<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Border: Allows you to specify the style, width, and color of an element's border. */
        p{
            text-align: center;
            padding: 15px;
            border: 4px double red;
            border-radius: 20px;
        }

        div{
            text-align: center;
            padding: 10px;
            border-top: 4px dotted yellow;
            border-left: 8px inset yellow;
            border-right: 12px outset yellow;
            border-bottom: 4px dashed blue;
        }
    </style>
</head>
<body>
    <p>This is a border</p>
    <br><br>
    <div>This is also a border</div>
</body>
</html>
