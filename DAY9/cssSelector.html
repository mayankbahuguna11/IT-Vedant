<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- A css selector is the first part of a css rule that tells the browser 
    exactly which html elements to target and style.

    1. Universal Selector(*): Selects all elements on the page and applies the same style universally.
    2. Element Selector: Targets all elements of a specific type such as paragraphs or headers.
    3. ID Selector Used to target and style a single, unique element based on its id attribute. 
       An element can only have one ID. 
    4. Class Selector: Used to select and style HTML elements that share a specific class attribute.
       Class selectors can be applied to as many elements as needed.-->

    <p>Hello</p>
    <div>This is css lecture</div>
    <p id="mypara">This is ID Selector</p>
    <p class="paraclass">This is Class Selector</p>
    <p class="para2class paraclass">This uses 2 class selectors</p>
    <h1>Welcome to the website</h1>
    <p>demo</p>

    <!-- Priority Order (High to Low)
    1. Inline Css
    2. ID Selector
    3. Class Selector
    4. Element Selector
    5. Universal Selector -->

</body>
</html>
