    /* Attribute Value Selector: It targets elements with a particular attribute value */
    /* a[href="combinatorSelector.html"]{
        color: red;
    } */
    
    /* Substring Matching (start with): It matches the element where the attribute starts with a substring */
    /* a[href^="css"]{
        color: red;
    } */
    
    /* End with Selector: It matches the element where the attribute value ends with a specific substring */
    /* img[alt$="age"]{
        color: red;
    } */

    /* Wildcard Selector (contain with): It matches the element where the attribute contains a specific substring at any position*/
    /* a[href*="or"]{
