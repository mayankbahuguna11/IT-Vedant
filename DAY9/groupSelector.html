<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Group Selector: Apply the same style definitions to multiple elements simultaneously, minimizing code repetition. */
        p, div, h2{
            color: blue;
        }
    </style>
</head>
<body>
    <div>This is div tag</div>
    <div>This is div tag</div>
    <div>This is div tag</div>
    <p>This is a para</p>
    <p>This is a para</p>
    <p>This is a para</p>
    <h2>This is h2 tag</h2>
</body>
</html>
