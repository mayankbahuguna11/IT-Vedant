<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 300px;
            height: 200px;
            margin: 50px;
            background: rgb(187, 166, 166);
            border-radius: 50px;
            box-shadow: 30px 20px 50px 10px green;
        }
        /* Box-shadow: Used to add a shadow effect around a HTML element. */
        /* box-shadow parameters: Horizontal Vertical Blur Spread Color */
    </style>
</head>
<body>
    <div class="box">hello</div>
</body>
</html>
