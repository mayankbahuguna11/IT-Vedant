<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            /* CSS gradient: Creates a smooth transition between two or more colorsbinstead of using a single solid colour.
            Types: linear, radial and conic */

            /* background: linear-gradient(to left, red, yellow, blue); */
            background: linear-gradient(90deg,rgba(131, 58, 180, 1) 0%, rgba(253, 29, 29, 1) 50%, rgba(252, 176, 69, 1) 100%);
            color: white;
            height: 50px;
        }

        h2{
            /* Radial gradient: Starts from a central point and spreads outward in a circular or elliptical shape. */
            background: radial-gradient(blue, yellow, purple);
            color: white;
            height: 50px;
        }

        h3{
            background: conic-gradient(red, yellow);
            color: white;
            height: 50px;
        }
    </style>

</head>
<body>
    <h1>This is my website</h1>
    <h2>Radial Gradient</h2>
    <h3>Conic Gradient</h3>
</body>
</html>
