<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>This is iframe lecture</h1>
    <!-- iframe is used to show a web page within a web page -->
        <iframe src="index.html" frameborder="3" width="400px" height="300px"></iframe>

       <br> <br>

        <iframe src="https://www.wikipedia.org/" frameborder="1"  width="600px" height="600px"></iframe>

        <br> <br>

        <iframe width="560" height="315" src="https://www.youtube.com/embed/2oCN2q1x3c4?si=uZLuK0Usc4uaOpSm" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        
        <br><br>

        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3767.2175618553915!2d72.85451167479688!3d19.229347782007107!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7b187b227565b%3A0x6b501cc07463dd16!2sItvedant%20-%20Borivali!5e0!3m2!1sen!2sin!4v1787652278962!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

        <br><br>
        <!-- Target attribute specifies where to open the linked document
        _self: Opens link in same frame/tab
        _blank: Opens link in new tab
        _parent: Opens link in parent frame of current frame
        _top: Opens link  in full body of the windows, canceling all frames
        framename: Opens the linked document in the named iframe -->
        <a href="https://www.wikipedia.org/" target="myframe">Wikipedia</a>
        <br> <br>
        <a href="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3767.2175618553915!2d72.85451167479688!3d19.229347782007107!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7b187b227565b%3A0x6b501cc07463dd16!2sItvedant%20-%20Borivali!5e0!3m2!1sen!2sin!4v1787652278962!5m2!1sen!2sin" target="myframe">Maps</a>
        <br><br>
        <iframe src="" frameborder="5" name="myframe" width="400px" height="500"></iframe>
</body>
</html>
